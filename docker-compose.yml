version: "3.8"
services:
  groupscape-frontend:
    image: mayzrdev/groupscape-frontend
    environment:
      - HOST_URL=${HOST_URL}
    restart: always
    container_name: groupscape-frontend
    ports:
      - 4000:4000 # replace this if using a docker-compatible reverse proxy like traefik
  groupscape-backend:
    # build:
    # context: ./server
    # dockerfile: Dockerfile
    image: mayzrdev/groupscape-backend
    environment:
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_DB=${PG_DB}
      - BACKEND_SECRET=${BACKEND_SECRET}
      - VANTAGE_API_KEY=${VANTAGE_API_KEY}
      - HOMEPAGE_API_KEY=${HOMEPAGE_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - REDIS_URL=redis://groupscape-redis:6379
    restart: always
    depends_on:
      - "postgres"
      - "groupscape-redis"
    container_name: groupscape-backend
    ports:
      - 5000:8080 # replace this if using a docker-compatible reverse proxy like traefik
  groupscape-redis:
    image: redis:7-alpine
    restart: always
    container_name: groupscape-redis
    # Pure response cache, no persistence needed - fine to lose on restart.
  groupscape-postgres:
    image: postgres
    restart: always
    container_name: groupscape-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - ./pg-data:/var/lib/postgresql/data # change the left-hand side of : to the path you prefer the DB to store the data in
      - ./server/src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql # change the left-hand side of the : to the path that contains the schema.sql
