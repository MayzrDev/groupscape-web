services:
  groupscape-web-backend:
    image: groupscape-web-backend:latest
    container_name: groupscape-web-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: groupscape-web-db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-groupscape_db}
      BACKEND_SECRET: ${BACKEND_SECRET}
      VANTAGE_API_KEY: ${VANTAGE_API_KEY:-}
      HOMEPAGE_API_KEY: ${HOMEPAGE_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
    ports:
      - "${API_PORT:-3021}:8080"
    restart: unless-stopped
    depends_on:
      groupscape-web-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - groupscape-web

  groupscape-web-demo-reset:
    image: groupscape-web-backend:latest
    container_name: groupscape-web-demo-reset
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: groupscape-web-db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-groupscape_db}
      BACKEND_SECRET: ${BACKEND_SECRET}
    # Re-seeds the public "@EXAMPLE" demo group on a loop, so it never visibly goes stale and
    # any write that somehow slipped past the read-only gate gets reset. Deliberately never
    # passes --include-admin-data - that data is dev/QA-only (see seed.rs) and must never exist
    # in production.
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["sh", "-c", "while true; do /app/seed; sleep ${DEMO_RESET_INTERVAL_SECONDS:-21600}; done"]
    restart: unless-stopped
    depends_on:
      groupscape-web-db:
        condition: service_healthy
    networks:
      - groupscape-web

  groupscape-web-frontend:
    image: groupscape-web-frontend:latest
    container_name: groupscape-web-frontend
    build:
      context: ./site
      dockerfile: Dockerfile
    environment:
      HOST_URL: ${HOST_URL}
    ports:
      - "${WEB_PORT:-3020}:4000"
    restart: unless-stopped
    depends_on:
      groupscape-web-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - groupscape-web

  groupscape-web-db:
    image: postgres:16-alpine
    container_name: groupscape-web-db
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-groupscape_db}
    volumes:
      - /opt/groupscape/db:/var/lib/postgresql/data
      - ./server/src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "${DB_PORT:-3022}:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-groupscape_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - groupscape-web

networks:
  groupscape-web:
    driver: bridge
