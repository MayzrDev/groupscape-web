<div class="edit-member__row">
  <span class="edit-member__status ${this.member.inactive ? "edit-member__status--offline" : ""}"></span>
  <div class="edit-member__info">
    <div class="edit-member__name">${this.member.name}</div>
    <div class="edit-member__meta">${this.lastSeenText()}</div>
  </div>
  <div class="edit-member__buttons">
    ${this.canKick ? `<button class="edit-member__remove men-button small">Remove</button><button class="edit-member__block men-button small">Block</button>` : ""}
  </div>
</div>

<div class="edit-member__error validation-error"></div>
