<div class="admin-page-head">
  <h1>Feature Flags</h1>
</div>

<div class="admin-flags__error admin-error"></div>

<div class="admin-panel">
  <div class="admin-flags__list"></div>

  <div class="admin-flags__add-form">
    <div class="admin-flags__field">
      <label>Flag key</label>
      <input class="admin-flags__new-key" placeholder="new_flag_key" />
    </div>
    <div class="admin-flags__field admin-flags__field--grow">
      <label>Description</label>
      <input class="admin-flags__new-desc" placeholder="What this flag controls" />
    </div>
    <button class="admin-btn admin-btn--primary admin-flags__add">Add flag</button>
  </div>
</div>
