<div class="loot-log-group__header">
  <div class="loot-log-group__name-wrap">
    ${
      this.iconUrl
        ? `<img class="loot-log-group__boss-icon" src="${this.iconUrl}" alt="" />`
        : `<span class="loot-log-group__source-dot"></span>`
    }
    <div>
      <div class="loot-log-group__name">
        <player-icon player-name="${this.group.memberName}"></player-icon>
        <span>${this.sourceLabel}</span>
      </div>
      <div class="loot-log-group__meta">${this.group.events.length.toLocaleString()} ${this.countLabel} &middot; ${this.timeRangeLabel}</div>
    </div>
  </div>
  <div class="loot-log-group__total">${this.totalValue.toLocaleString()} gp</div>
</div>
<div class="loot-log-group__grid"></div>
