<div class="player-panel__header">
  ${this.portraitMode === "bust" ? `<player-portrait mode="bust" player-name="${this.playerName}"></player-portrait>` :
  ""}
  <player-stats player-name="${this.playerName}"></player-stats>
</div>
<div class="player-panel__minibar">
  <button type="button" data-component="player-inventory">
    <img src="/ui/777-0.png" width="26" height="28" />
  </button>
  <button type="button" data-component="player-equipment">
    <img src="/ui/778-0.png" width="27" height="32" />
  </button>
  <button type="button" data-component="player-skills">
    <img src="/ui/3579-0.png" width="23" height="22" />
  </button>
  <button type="button" data-component="player-quests">
    <img src="/ui/776-0.png" width="22" height="22" />
  </button>
  <button type="button" data-component="player-diaries">
    <img src="/ui/1298-0.png" width="22" height="22" />
  </button>
  <button type="button" class="player-panel__collection-log">
    <img src="/icons/items/22711.webp" width="32" height="28" />
  </button>
  <button type="button" class="player-panel__combat-achievements">
    <svg viewBox="0 0 24 24" width="26" height="26">
      <path d="M4 3.5C4 2.7 4.7 2 5.5 2H18a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 19.5V3.5Z" fill="#7a2e2e" stroke="#c25a3c" stroke-width="1"/>
      <path d="M6 2.3v18.4" stroke="#e9c98a" stroke-width="1" opacity=".6"/>
      <path d="M9.5 8h5M9.5 11h5M9.5 14h3.2" stroke="#e9c98a" stroke-width="1" stroke-linecap="round" opacity=".85"/>
      <circle cx="12" cy="5" r="1.4" fill="#d4af37"/>
    </svg>
  </button>
</div>
<div class="player-panel__content"></div>
${ this.portraitMode === "full" ? `<player-portrait
  mode="full"
  player-name="${this.playerName}"
  class="player-panel__portrait-full"
></player-portrait
>` : "" }
