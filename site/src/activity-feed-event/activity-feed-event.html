<div class="activity-feed-event__badge activity-feed-event__badge--${this.displayType}">
  ${this.badgeLabel}
</div>
<div class="activity-feed-event__body">
  <div class="activity-feed-event__line">${this.descriptionHtml()}</div>
  ${this.loot.length > 0 ? `
  <div class="activity-feed-event__loot">
    ${this.loot.map((item) => `<item-box item-id="${item.item_id}" item-quantity="${item.quantity}" no-tooltip></item-box>`).join("")}
  </div>
  ` : ""}
</div>
<div class="activity-feed-event__meta">
  <span class="activity-feed-event__time" title="${this.occurredAt.toLocaleString()}">${this.relativeTime}</span>
  ${this.reactionsEnabled ? `
  <div class="activity-feed-event__like-wrap">
    <button
      type="button"
      class="activity-feed-event__like-btn"
      title="Like — press and hold for more reactions"
    >
      <svg class="activity-feed-event__like-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.5 7h2.2v7H2.5a.7.7 0 0 1-.7-.7V7.7a.7.7 0 0 1 .7-.7Z" fill="#8a7a5c"/>
        <path d="M5.7 7.2 8.6 2c.4-.1.9 0 1.2.3.3.3.4.7.3 1.1L9.4 6h3.9c.5 0 .9.2 1.2.6.3.4.4.9.2 1.3l-1.7 5.1c-.2.6-.8 1-1.4 1H5.7V7.2Z" fill="#e6c34a"/>
      </svg>
    </button>
    <div class="activity-feed-event__radial" hidden></div>
  </div>
  <button type="button" class="activity-feed-event__comment-btn" title="Comments">
    <svg class="activity-feed-event__comment-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6A1.5 1.5 0 0 1 12.5 11H7l-3.2 2.4a.5.5 0 0 1-.8-.4V11h-.5A1.5 1.5 0 0 1 1 9.5v-6Z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.1"/>
    </svg>
    <span class="activity-feed-event__comment-count">0</span>
  </button>
  <div class="activity-feed-event__pills"></div>
  ` : ""}
</div>
${this.reactionsEnabled ? `
<div class="activity-feed-event__comments-panel" hidden>
  <div class="activity-feed-event__comments-list"></div>
  <div class="activity-feed-event__comments-compose">
    <input type="text" class="activity-feed-event__comment-input" maxlength="300" placeholder="Add a comment&hellip;" />
    <button type="button" class="activity-feed-event__comment-send men-button small">Send</button>
  </div>
  <div class="activity-feed-event__comments-error"></div>
  <div class="activity-feed-event__comments-indicator">0 / 10 comments</div>
</div>
` : ""}
