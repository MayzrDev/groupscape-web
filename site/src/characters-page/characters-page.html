<div class="characters-page__container rsborder rsbackground">
  <div class="characters-page__topbar">
    <men-link link-href="/account" class="characters-page__account-link">&larr; Back to account</men-link>
    <p class="characters-page__status"></p>
  </div>
  <div class="characters-page__error validation-error"></div>

  <div class="characters-page__layout" hidden>
    <nav class="characters-page__sidebar"></nav>
    <div class="characters-page__detail"></div>
  </div>

  <div class="dialog characters-page__join-dialog">
    <div class="dialog__container characters-page__join-dialog-container rsborder rsbackground">
      <h2>Join a group</h2>
      <p class="characters-page__join-dialog-sub"></p>
      <men-input
        class="characters-page__join-dialog-token"
        max-length="256"
        input-id="joinGroupToken"
        placeholder-text="Group token"
        input-label="Group token"
        type-password
      ></men-input>
      <p class="characters-page__join-dialog-error validation-error"></p>
      <div class="characters-page__join-dialog-buttons">
        <button class="characters-page__join-dialog-submit men-button">Join</button>
        <button class="characters-page__join-dialog-cancel men-button">Cancel</button>
      </div>
    </div>
  </div>
</div>
