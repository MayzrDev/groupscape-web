<div class="admin-login__container rsborder rsbackground">
  <span class="admin-login__ribbon">Admin</span>
  <h1>Admin sign-in</h1>
  <p class="admin-login__sub">This is separate from group login. Enter the admin token to continue.</p>
  <men-input
    class="admin-login__token"
    max-length="200"
    input-id="adminToken"
    placeholder-text="Admin token"
    input-label="Admin token"
    type-password
  ></men-input>
  <button class="admin-login__button men-button">Enter admin panel</button>
  <div class="admin-login__error validation-error"></div>
</div>
